{% extends "base.html" %} {% block title %}Calc - Happy Paws{% endblock %}
<span class="visually-hidden"></span>{% block content %}{% load static %}
<script src="{% static 'js/petFoodCalc.js' %}"></script>
<h1>How much should my pet eat?</h1>
<p>Weight and age in, daily food amount out.</p>
<form id="calc-form">
  <label for="weightInput">Weight (KG)</label>
  <input
    class="my-2"
    type="number"
    id="weightInput"
    step="0.1"
    min="0.1"
    placeholder="Weight"
  /><br />

  <label for="ageInput">Age</label>
  <input placeholder="Age" type="number" id="ageInput" min="0" step="0.5" />
  <br />
  <label for="activityInput">Activity level</label>
  <select class="my-2" id="activityInput">
    <option value="low">Low</option>
    <option value="normal" selected>Normal</option>
    <option value="high">High</option>
  </select>
  <br />
  <button
    class="btn btn-primary"
    onclick="calculatePetFood(document)"
    type="button"
  >
    Calculate
  </button>
</form>
<div id="result"></div>
<p><a href="{% url 'home' %}">Back to home</a></p>
{% endblock %}
